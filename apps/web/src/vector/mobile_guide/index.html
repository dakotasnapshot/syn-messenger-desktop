<!doctype html>

<html lang="en">
    <head>
        <title>Syndicate Mobile Guide</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="apple-itunes-app" content="app-id=id6809166852" />
    </head>

    <body>
        <div class="mx_HomePage_errorContainer">
            <!-- populated by JS if needed -->
        </div>

        <div class="mx_HomePage_container">
            <header>
                <div class="mx_HomePage_header">
                    <div>
                        <img src="./assets/syndicate-logo.svg" alt="Syndicate Logo" width="48px" height="48px" />
                    </div>
                    <div>
                        <p id="header_title">Join Syndicate.</p>
                    </div>
                </div>
                <hr />
            </header>

            <main>
                <div class="mx_HomePage_col mx_Spacer">
                    <p>
                        Use <a id="back_to_syndicate_button" href="../" class="mx_DesktopLink">Syndicate Web</a>
                        or download the mobile app.
                    </p>
                </div>
                <div class="mx_HomePage_col mx_Spacer">
                    <div class="mx_HomePage_row">
                        <div class="mx_HomePage_step_number">
                            <span>1</span>
                        </div>
                        <div>
                            <h1 id="step1_heading">Download Syndicate</h1>
                            <div class="mx_StoreLinks">
                                <a
                                    href="https://apps.apple.com/app/id6809166852"
                                    target="_blank"
                                    class="mx_StoreBadge"
                                    id="app_store_link"
                                >
                                    <img
                                        src="./assets/app-store-badge.svg"
                                        alt="Download on the App Store."
                                        width="120px"
                                        height="40px"
                                    />
                                </a>
                                <a
                                    href="https://synmessenger.com/downloads/#android"
                                    target="_blank"
                                    class="mx_StoreBadge"
                                    id="play_store_link"
                                >
                                    Download for Android
                                </a>
                            </div>
                            <p id="f_droid_section" style="display: none">
                                Also available on
                                <a
                                    href="https://synmessenger.com/downloads/#android"
                                    target="_blank"
                                    class="mx_ClearDecoration"
                                    id="f_droid_link"
                                    >F-Droid</a
                                >
                            </p>
                        </div>
                    </div>
                </div>
                <div id="step2_container" class="mx_HomePage_col mx_Spacer" style="display: none">
                    <div class="mx_HomePage_row">
                        <div class="mx_HomePage_step_number">
                            <span>2</span>
                        </div>
                        <div>
                            <h1>Or sign in on the web</h1>
                            <p id="step2_description">Open Syndicate Web to sign in</p>
                            <a class="mx_Button" id="deep_link_button" href="#">Sign in</a>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <footer>
            <div class="mx_BottomGradient"></div>
        </footer>
    </body>
</html>
