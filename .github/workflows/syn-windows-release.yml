name: SYN Windows release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Release version without a leading v
                required: true
                default: 0.1.10
    push:
        branches:
            - syn/main
        tags:
            - syn-v*

permissions:
    contents: read
    actions: read

jobs:
    build-and-sign:
        runs-on: windows-latest
        timeout-minutes: 40
        env:
            VARIANT_PATH: syn/release/build.json
            CSC_IDENTITY_AUTO_DISCOVERY: "false"
        steps:
            - name: Check out source
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set release version
              shell: pwsh
              run: |
                  if ("${{ github.event_name }}" -eq "workflow_dispatch") {
                    $version = "${{ inputs.version }}"
                  } elseif ("${{ github.ref_type }}" -eq "tag") {
                    $version = "${{ github.ref_name }}" -replace '^syn-v', ''
                  } else {
                    $version = "0.1.10"
                  }
                  if ($version -notmatch '^\d+\.\d+\.\d+$') {
                    throw "Invalid release version: $version"
                  }
                  "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

            - uses: pnpm/action-setup@v4
              with:
                  version: 11.22.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: apps/desktop/.node-version
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Smoke test native acceptance startup
              timeout-minutes: 2
              run: pnpm --filter element-desktop exec electron scripts/test-managed-update.mjs --self-check

            - name: Build customized Syndicate web client
              env:
                  NODE_OPTIONS: --max-old-space-size=6144
                  NX_DAEMON: "false"
                  NX_ISOLATE_PLUGINS: "false"
              run: pnpm --filter element-web build

            - name: Test Syndicate GIF integration
              run: pnpm exec vitest run apps/web/src/utils/GiphyClient.test.ts apps/desktop/src/managed-update-manifest.test.ts apps/desktop/src/managed-updater.test.ts

            - name: Package and verify Syndicate renderer
              working-directory: apps/desktop
              env:
                  GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
              run: node scripts/package-syndicate-web.ts

            - name: Build Windows installers
              run: pnpm --filter element-desktop build:64

            - name: Collect unsigned installers
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force windows-unsigned | Out-Null
                  Copy-Item "apps/desktop/dist/Syndicate $env:VERSION.msi" windows-unsigned/
                  Copy-Item "apps/desktop/dist/squirrel-windows/Syndicate Setup $env:VERSION.exe" windows-unsigned/
                  Copy-Item "apps/desktop/dist/squirrel-windows/*-full.nupkg" windows-unsigned/
                  Copy-Item "apps/desktop/dist/squirrel-windows/RELEASES" windows-unsigned/

            - name: Upload unsigned build for verification
              id: unsigned
              uses: actions/upload-artifact@v4
              with:
                  name: syn-messenger-windows-unsigned-${{ env.VERSION }}
                  path: windows-unsigned/
                  if-no-files-found: error
                  retention-days: 14

            - name: Submit release to SignPath
              if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
              uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627
              with:
                  api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
                  organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
                  project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
                  signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
                  artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
                  github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
                  wait-for-completion: true
                  wait-for-completion-timeout-in-seconds: 1800
                  output-artifact-directory: windows-signed
                  parameters: |
                      Version: "${{ env.VERSION }}"
                      ProductName: "Syndicate"

            - name: Upload signed release
              if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
              uses: actions/upload-artifact@v4
              with:
                  name: syn-messenger-windows-signed-${{ env.VERSION }}
                  path: windows-signed/
                  if-no-files-found: error
                  retention-days: 30

            - name: Upload renderer provenance
              uses: actions/upload-artifact@v4
              with:
                  name: syndicate-renderer-windows-${{ env.VERSION }}
                  path: |
                      apps/desktop/webapp.asar
                      apps/web/webapp/syndicate-release.json
                  if-no-files-found: error
                  retention-days: 30

            - name: Fetch exact previously published Windows installers
              uses: actions/download-artifact@v4
              with:
                  name: syn-messenger-windows-unsigned-0.1.9
                  path: acceptance/previous
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: 42017041651

            - name: Native MSI updater acceptance
              shell: pwsh
              timeout-minutes: 10
              run: |
                  $ErrorActionPreference = "Stop"
                  New-Item -ItemType Directory -Force acceptance | Out-Null
                  $old = (Resolve-Path "acceptance/previous/Syndicate 0.1.9.msi").Path
                  if ((Get-FileHash $old).Hash.ToLower() -ne "4942056767a0e31f35b82255aaa3bc964c7d9f6459cdf418c790c973f1f09844") { throw "Previous published MSI hash mismatch" }
                  Copy-Item $old acceptance/previous.msi
                  $previous = (Resolve-Path acceptance/previous.msi).Path
                  $p = Start-Process msiexec.exe -ArgumentList "/i `"$previous`" /qn /norestart" -Wait -PassThru
                  if ($p.ExitCode -notin @(0,3010)) { throw "Previous MSI failed: $($p.ExitCode)" }
                  $installed = @(Get-ChildItem "$env:ProgramFiles/Syndicate" -Filter Syndicate.exe -Recurse)
                  if ($installed.Count -ne 1) { throw "Expected one MSI app executable" }
                  $candidate = (Resolve-Path "apps/desktop/dist/Syndicate $env:VERSION.msi").Path
                  $testRoot = "$pwd/acceptance/msi"
                  pnpm --filter element-desktop exec electron scripts/test-managed-update.mjs msi "$candidate" "$($installed[0].FullName)" "$testRoot" 2>&1 | Tee-Object -FilePath acceptance/msi-harness.log
                  if ($LASTEXITCODE -ne 0) { throw "MSI updater harness failed" }
                  if (-not (Test-Path "$testRoot/updater-result.json")) { throw "Missing MSI updater receipt" }
                  $renderer = Join-Path $installed[0].DirectoryName "resources/webapp.asar"
                  $expected = (Get-FileHash apps/desktop/webapp.asar).Hash
                  for ($i=0; $i -lt 120; $i++) {
                    if ((Test-Path $renderer) -and (Get-FileHash $renderer).Hash -eq $expected) { break }
                    Start-Sleep -Seconds 1
                  }
                  if ((Get-FileHash $renderer).Hash -ne $expected) { throw "Installed MSI renderer mismatch" }
                  "MSI updater 0.1.9 -> 0.1.10: PASS" | Set-Content acceptance/native-result.txt

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: syndicate-windows-updater-acceptance
                  path: |
                      acceptance/**/updater-result.json
                      acceptance/native-result.txt
                      acceptance/msi-harness.log
                  if-no-files-found: warn
