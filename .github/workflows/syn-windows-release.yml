name: SYN Windows release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Release version without a leading v
                required: true
                default: 0.1.9
    push:
        branches:
            - syn/main
        tags:
            - syn-v*

permissions:
    contents: read

jobs:
    build-and-sign:
        runs-on: windows-latest
        env:
            VARIANT_PATH: syn/release/build.json
            CSC_IDENTITY_AUTO_DISCOVERY: "false"
        steps:
            - name: Check out source
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set release version
              shell: pwsh
              run: |
                  if ("${{ github.event_name }}" -eq "workflow_dispatch") {
                    $version = "${{ inputs.version }}"
                  } elseif ("${{ github.ref_type }}" -eq "tag") {
                    $version = "${{ github.ref_name }}" -replace '^syn-v', ''
                  } else {
                    $version = "0.1.9"
                  }
                  if ($version -notmatch '^\d+\.\d+\.\d+$') {
                    throw "Invalid release version: $version"
                  }
                  "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

            - uses: pnpm/action-setup@v4
              with:
                  version: 11.22.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: apps/desktop/.node-version
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build customized Syndicate web client
              env:
                  NODE_OPTIONS: --max-old-space-size=6144
                  NX_DAEMON: "false"
                  NX_ISOLATE_PLUGINS: "false"
              run: pnpm --filter element-web build

            - name: Test Syndicate GIF integration
              run: pnpm exec vitest run apps/web/src/utils/GiphyClient.test.ts

            - name: Package and verify Syndicate renderer
              working-directory: apps/desktop
              env:
                  GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
              run: node scripts/package-syndicate-web.ts

            - name: Build Windows installers
              run: pnpm --filter element-desktop build:64

            - name: Collect unsigned installers
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force windows-unsigned | Out-Null
                  Copy-Item "apps/desktop/dist/Syndicate $env:VERSION.msi" windows-unsigned/
                  Copy-Item "apps/desktop/dist/squirrel-windows/Syndicate Setup $env:VERSION.exe" windows-unsigned/
                  Copy-Item "apps/desktop/dist/squirrel-windows/*-full.nupkg" windows-unsigned/
                  Copy-Item "apps/desktop/dist/squirrel-windows/RELEASES" windows-unsigned/

            - name: Upload unsigned build for verification
              id: unsigned
              uses: actions/upload-artifact@v4
              with:
                  name: syn-messenger-windows-unsigned-${{ env.VERSION }}
                  path: windows-unsigned/
                  if-no-files-found: error
                  retention-days: 14

            - name: Submit release to SignPath
              if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
              uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627
              with:
                  api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
                  organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
                  project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
                  signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
                  artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
                  github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
                  wait-for-completion: true
                  wait-for-completion-timeout-in-seconds: 1800
                  output-artifact-directory: windows-signed
                  parameters: |
                      Version: "${{ env.VERSION }}"
                      ProductName: "Syndicate"

            - name: Upload signed release
              if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
              uses: actions/upload-artifact@v4
              with:
                  name: syn-messenger-windows-signed-${{ env.VERSION }}
                  path: windows-signed/
                  if-no-files-found: error
                  retention-days: 30

            - name: Upload renderer provenance
              uses: actions/upload-artifact@v4
              with:
                  name: syndicate-renderer-windows-${{ env.VERSION }}
                  path: |
                      apps/desktop/webapp.asar
                      apps/web/webapp/syndicate-release.json
                  if-no-files-found: error
                  retention-days: 30
