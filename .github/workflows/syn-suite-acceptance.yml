name: Syndicate suite packaged updater acceptance
on:
    workflow_dispatch:
        inputs:
            linux_run_id:
                required: false
                type: string
            windows_run_id:
                required: false
                type: string
            use_source_updater:
                required: false
                type: boolean
                default: false
permissions:
    contents: read
    actions: read
jobs:
    linux:
        if: ${{ inputs.linux_run_id != '' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 11.22.0
            - uses: actions/setup-node@v4
              with:
                  node-version-file: apps/desktop/.node-version
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libnotify4 libxss1 libxtst6 libsecret-1-0
            - name: Download built Linux candidate
              uses: actions/download-artifact@v4
              with:
                  name: syndicate-linux-0.1.14
                  path: apps/desktop/dist
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ inputs.linux_run_id }}
            - name: Extract exact packaged updater code
              run: |
                  set -euo pipefail
                  mkdir -p acceptance/candidate
                  tar -xzf apps/desktop/dist/*.tar.gz -C acceptance/candidate
                  candidate="$PWD/acceptance/candidate/syn-messenger-0.1.14"
                  node apps/desktop/scripts/extract-managed-test-modules.mjs "$candidate/resources/app.asar" "$PWD/acceptance/modules"
                  cp "$candidate/resources/webapp.asar" apps/desktop/webapp.asar
                  echo "MANAGED_TEST_MODULE_DIR=$PWD/acceptance/modules" >> "$GITHUB_ENV"
            - name: Optional source updater preflight (not packaged acceptance)
              if: ${{ inputs.use_source_updater }}
              run: |
                  pnpm exec tsc -p apps/desktop/tsconfig.json --noCheck
                  node apps/desktop/scripts/extract-managed-test-modules.mjs apps/desktop/lib acceptance/modules --source

            - name: Fetch previous published Linux installers
              shell: bash
              run: |
                  mkdir -p acceptance/previous
                  curl --fail --location --retry 3 https://github.com/dakotasnapshot/syndicate-releases/releases/download/desktop-v0.1.11/Syndicate-0.1.11-Linux-x86_64.deb -o acceptance/previous/syn-messenger_0.1.11_amd64.deb
                  curl --fail --location --retry 3 https://github.com/dakotasnapshot/syndicate-releases/releases/download/desktop-v0.1.11/Syndicate-0.1.11-Linux-x86_64.tar.gz -o acceptance/previous/syn-messenger-0.1.11.tar.gz

            - name: Native Debian and portable updater acceptance
              shell: bash
              timeout-minutes: 10
              run: |
                  set -euo pipefail
                  mkdir -p acceptance
                  test "$(sha256sum acceptance/previous/syn-messenger_0.1.11_amd64.deb | cut -d' ' -f1)" = "c78ba1e631055fc5ce6aa2f3aab4de7f87c9e6d45672d3a696c91d70afd255a0"
                  cp acceptance/previous/syn-messenger_0.1.11_amd64.deb acceptance/previous.deb
                  sudo dpkg --install acceptance/previous.deb
                  node apps/desktop/scripts/extract-managed-test-modules.mjs "$(dirname "$(dpkg -L syn-messenger | sed -n '\|^/opt/.*/syn-messenger$|p' | head -1)")/resources/app.asar" "$PWD/acceptance/legacy-modules"
                  export MANAGED_TEST_CURRENT_VERSION=0.1.11 MANAGED_TEST_0.1.14=0.1.14
                  export MANAGED_TEST_GITHUB_DELIVERY=1
                  candidate_modules="$MANAGED_TEST_MODULE_DIR"
                  export MANAGED_TEST_MODULE_DIR="$PWD/acceptance/legacy-modules"
                  previous=$(dpkg -L syn-messenger | sed -n '\|^/opt/.*/syn-messenger$|p' | head -1)
                  test -x "$previous"
                  candidate=$(realpath apps/desktop/dist/*.deb)
                  timeout 180s xvfb-run -a pnpm --filter element-desktop exec electron --no-sandbox scripts/test-managed-update.mjs deb "$candidate" "$previous" "$PWD/acceptance/deb" 2>&1 | tee acceptance/deb-harness.log
                  test "$(dpkg-query -W -f='${Version}' syn-messenger)" = "0.1.14"
                  sha256sum "$(dirname "$previous")/resources/webapp.asar" apps/desktop/webapp.asar | awk '{print $1}' | uniq | wc -l | xargs test 1 -eq
                  test "$(sha256sum acceptance/previous/syn-messenger-0.1.11.tar.gz | cut -d' ' -f1)" = "9d46e46420a70d34158d7c23ddca587d21d538afa6a13a76b4fe519b3558464c"
                  cp acceptance/previous/syn-messenger-0.1.11.tar.gz acceptance/previous.tar.gz
                  tar -xzf acceptance/previous.tar.gz -C acceptance
                  portable="$PWD/acceptance/syn-messenger-0.1.11"
                  archive=$(realpath apps/desktop/dist/*.tar.gz)
                  timeout 180s xvfb-run -a pnpm --filter element-desktop exec electron --no-sandbox scripts/test-managed-update.mjs tar.gz "$archive" "$portable/syn-messenger" "$PWD/acceptance/portable" 2>&1 | tee acceptance/portable-harness.log
                  expected=$(sha256sum apps/desktop/webapp.asar | cut -d' ' -f1)
                  for i in $(seq 1 30); do
                    actual=$(sha256sum "$portable/resources/webapp.asar" 2>/dev/null | cut -d' ' -f1 || true)
                    [ "$actual" != "$expected" ] || break
                    sleep 1
                  done
                  test "$actual" = "$expected"
                  test -f "$portable.previous/resources/app.asar"
                  export MANAGED_TEST_MODULE_DIR="$candidate_modules"
                  export MANAGED_TEST_CURRENT_VERSION=0.1.14 MANAGED_TEST_0.1.14=0.1.15 MANAGED_TEST_GITHUB_DELIVERY=1 MANAGED_TEST_DOWNLOAD_ONLY=1
                  timeout 180s xvfb-run -a pnpm --filter element-desktop exec electron --no-sandbox scripts/test-managed-update.mjs deb "$candidate" "$previous" "$PWD/acceptance/github-deb"
                  timeout 180s xvfb-run -a pnpm --filter element-desktop exec electron --no-sandbox scripts/test-managed-update.mjs tar.gz "$archive" "$portable/syn-messenger" "$PWD/acceptance/github-tar"
                  unset MANAGED_TEST_DOWNLOAD_ONLY
                  export MANAGED_TEST_CURRENT_VERSION=0.1.11 MANAGED_TEST_0.1.14=0.1.14
                  # Repeat the portable update to prove its retained rollback set
                  # is rotated instead of blocking all subsequent updates.
                  timeout 180s xvfb-run -a pnpm --filter element-desktop exec electron --no-sandbox scripts/test-managed-update.mjs tar.gz "$archive" "$portable/syn-messenger" "$PWD/acceptance/portable-repeat" 2>&1 | tee acceptance/portable-repeat-harness.log
                  for i in $(seq 1 30); do
                    previous=$(sha256sum "$portable.previous/resources/webapp.asar" 2>/dev/null | cut -d' ' -f1 || true)
                    [ "$previous" != "$expected" ] || break
                    sleep 1
                  done
                  test "$previous" = "$expected"
                  echo "Native DEB and tar 0.1.11 -> 0.1.14 updater installs verified" > acceptance/native-result.txt

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: syndicate-linux-updater-acceptance
                  path: |
                      acceptance/**/updater-result.json
                      acceptance/native-result.txt
                      acceptance/*-harness.log
                      acceptance/modules/packaged-module-hashes.json
                      acceptance/modules/source-preflight-module-hashes.json
                      acceptance/**/install.log
                  if-no-files-found: warn

    windows:
        if: ${{ inputs.windows_run_id != '' }}
        runs-on: windows-latest
        env:
            VERSION: 0.1.14
            MANAGED_WINDOWS_DIAGNOSTICS: ${{ inputs.use_source_updater && '1' || '0' }}
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 11.22.0
            - uses: actions/setup-node@v4
              with:
                  node-version-file: apps/desktop/.node-version
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Download built Windows candidate
              uses: actions/download-artifact@v4
              with:
                  name: syn-messenger-windows-unsigned-0.1.14
                  path: apps/desktop/dist
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ inputs.windows_run_id }}
            - name: Extract exact packaged updater code
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"
                  New-Item -ItemType Directory -Force acceptance/candidate | Out-Null
                  Add-Type -AssemblyName System.IO.Compression.FileSystem
                  $package = @(Get-ChildItem apps/desktop/dist -Filter "*-full.nupkg")
                  if ($package.Count -ne 1) { throw "Expected one NuGet candidate" }
                  [System.IO.Compression.ZipFile]::ExtractToDirectory($package[0].FullName, "$pwd/acceptance/candidate")
                  $app = "$pwd/acceptance/candidate/lib/net45/resources/app.asar"
                  node apps/desktop/scripts/extract-managed-test-modules.mjs "$app" "$pwd/acceptance/modules"
                  Copy-Item "$pwd/acceptance/candidate/lib/net45/resources/webapp.asar" apps/desktop/webapp.asar
                  "MANAGED_TEST_MODULE_DIR=$pwd/acceptance/modules" | Out-File -FilePath $env:GITHUB_ENV -Append
            - name: Optional source updater preflight (not packaged acceptance)
              if: ${{ inputs.use_source_updater }}
              run: |
                  pnpm exec tsc -p apps/desktop/tsconfig.json --noCheck
                  node apps/desktop/scripts/extract-managed-test-modules.mjs apps/desktop/lib acceptance/modules --source

            - name: Fetch previous published Windows installer
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force acceptance/previous | Out-Null
                  Invoke-WebRequest "https://github.com/dakotasnapshot/syndicate-releases/releases/download/desktop-v0.1.11/Syndicate-0.1.11-Windows-x64.msi" -OutFile "acceptance/previous/Syndicate 0.1.11.msi"

            - name: Native MSI updater acceptance
              shell: pwsh
              timeout-minutes: 10
              run: |
                  $ErrorActionPreference = "Stop"
                  New-Item -ItemType Directory -Force acceptance | Out-Null
                  $old = (Resolve-Path "acceptance/previous/Syndicate 0.1.11.msi").Path
                  if ((Get-FileHash $old).Hash.ToLower() -ne "1617d9beffe5a26bac47844ffa57bbeeb27a42da8845be50d97273983cac139e") { throw "Previous published MSI hash mismatch" }
                  Copy-Item $old acceptance/previous.msi
                  $previous = (Resolve-Path acceptance/previous.msi).Path
                  $p = Start-Process msiexec.exe -ArgumentList "/i `"$previous`" /qn /norestart" -Wait -PassThru
                  if ($p.ExitCode -notin @(0,3010)) { throw "Previous MSI failed: $($p.ExitCode)" }
                  $installed = @(Get-ChildItem "$env:ProgramFiles/Syndicate" -Filter Syndicate.exe -Recurse)
                  if ($installed.Count -ne 1) { throw "Expected one MSI app executable" }
                  Get-Process -Name Syndicate -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $installed[0].FullName } | Stop-Process -Force
                  $env:MANAGED_TEST_GITHUB_DELIVERY = "1"
                  $candidateModules = $env:MANAGED_TEST_MODULE_DIR
                  node apps/desktop/scripts/extract-managed-test-modules.mjs "$($installed[0].DirectoryName)/resources/app.asar" "$pwd/acceptance/legacy-modules"
                  $env:MANAGED_TEST_MODULE_DIR = "$pwd/acceptance/legacy-modules"
                  $env:MANAGED_TEST_CURRENT_VERSION = "0.1.11"
                  $env:MANAGED_TEST_0.1.14 = "0.1.14"
                  $candidate = (Resolve-Path "apps/desktop/dist/Syndicate $env:VERSION.msi").Path
                  $testRoot = "$pwd/acceptance/msi"
                  pnpm --filter element-desktop exec electron scripts/test-managed-update.mjs msi "$candidate" "$($installed[0].FullName)" "$testRoot" 2>&1 | Tee-Object -FilePath acceptance/msi-harness.log
                  if ($LASTEXITCODE -ne 0) { throw "MSI updater harness failed" }
                  if (-not (Test-Path "$testRoot/updater-result.json")) { throw "Missing MSI updater receipt" }
                  $renderer = Join-Path $installed[0].DirectoryName "resources/webapp.asar"
                  $expected = (Get-FileHash apps/desktop/webapp.asar).Hash
                  for ($i=0; $i -lt 120; $i++) {
                    if ((Test-Path $renderer) -and (Get-FileHash $renderer).Hash -eq $expected) { break }
                    Start-Sleep -Seconds 1
                  }
                  if ((Get-FileHash $renderer).Hash -ne $expected) { throw "Installed MSI renderer mismatch" }
                  $running = @()
                  for ($i=0; $i -lt 30; $i++) {
                    $running = @(Get-Process -Name Syndicate -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $installed[0].FullName })
                    if ($running.Count -gt 0) { break }
                    Start-Sleep -Seconds 1
                  }
                  if ($running.Count -eq 0) { throw "Updated MSI application did not relaunch" }
                  if ((Get-Content "$testRoot/profile/synthetic-profile-marker" -Raw) -ne "preserve-me") { throw "Profile marker changed after restart" }
                  $env:MANAGED_TEST_MODULE_DIR = $candidateModules
                  $env:MANAGED_TEST_CURRENT_VERSION = "0.1.14"
                  $env:MANAGED_TEST_0.1.14 = "0.1.15"
                  $env:MANAGED_TEST_GITHUB_DELIVERY = "1"
                  $env:MANAGED_TEST_DOWNLOAD_ONLY = "1"
                  pnpm --filter element-desktop exec electron scripts/test-managed-update.mjs msi "$candidate" "$($installed[0].FullName)" "$pwd/acceptance/github-msi"
                  if ($LASTEXITCODE -ne 0) { throw "Packaged GitHub transport acceptance failed" }
                  "MSI updater 0.1.11 -> 0.1.14 install and app relaunch: PASS" | Set-Content acceptance/native-result.txt

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: syndicate-windows-updater-acceptance
                  path: |
                      acceptance/**/updater-result.json
                      acceptance/native-result.txt
                      acceptance/msi-harness.log
                      acceptance/modules/packaged-module-hashes.json
                      acceptance/modules/source-preflight-module-hashes.json
                      acceptance/**/install.log
                  if-no-files-found: warn
