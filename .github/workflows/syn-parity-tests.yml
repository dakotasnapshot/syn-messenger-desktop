name: Syndicate desktop parity tests

on:
    workflow_dispatch:
        inputs:
            windows_run_id:
                description: Optional successful Windows artifact run to test an upgrade from ${{ inputs.previous_version }}
                required: false
                type: string
            candidate_version:
                description: Candidate version
                default: 0.1.10
                type: string
            previous_version:
                description: Previous published EXE version
                default: 0.1.9
                type: string
    push:
        branches:
            - syn/main

permissions:
    contents: read
    actions: read

jobs:
    encrypted-gif:
        if: ${{ !inputs.windows_run_id }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        env:
            NX_DAEMON: "false"
            NX_ISOLATE_PLUGINS: "false"
            NODE_OPTIONS: --max-old-space-size=6144
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 11.22.0
            - uses: actions/setup-node@v4
              with:
                  node-version-file: apps/desktop/.node-version
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: cp apps/desktop/syn/release/config.json apps/web/config.json
            - run: pnpm --filter element-web build
            - run: pnpm exec nx run playwright-common:build:playwright
            - run: pnpm exec playwright install --with-deps chromium
            - name: GIF, profile and preview regression tests
              run: pnpm exec vitest run apps/web/src/utils/GiphyClient.test.ts apps/web/src/components/views/rooms/MessageComposerUrlPreview.test.tsx apps/desktop/src/args.test.ts apps/desktop/src/config.test.ts
            - name: Verify encrypted GIF delivery
              working-directory: apps/web
              run: pnpm exec playwright test --config playwright.parity.config.ts --project=Chrome playwright/e2e/file-upload/gif-picker.spec.ts
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: syndicate-parity-test-results
                  path: |
                      apps/web/playwright/test-results/
                      apps/web/playwright/html-report/
                  retention-days: 14

    windows-upgrade:
        if: ${{ inputs.windows_run_id != '' }}
        runs-on: windows-latest
        timeout-minutes: 20
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: syn-messenger-windows-unsigned-${{ inputs.candidate_version }}
                  path: candidate
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ inputs.windows_run_id }}
            - name: Install published ${{ inputs.previous_version }} and apply candidate Squirrel update
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"
                  Invoke-WebRequest "https://synmessenger.com/downloads/Syndicate-Setup-${{ inputs.previous_version }}-Windows-x64.exe" -OutFile previous.exe
                  $install = Start-Process -FilePath "$pwd/previous.exe" -ArgumentList "--silent" -PassThru
                  if (-not $install.WaitForExit(180000)) { throw "Previous installer timed out" }
                  if ($install.ExitCode -ne 0) { throw "Previous installer failed: $($install.ExitCode)" }
                  $updaters = @(Get-ChildItem $env:LOCALAPPDATA -Filter Update.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { Test-Path "$($_.DirectoryName)/app-${{ inputs.previous_version }}" })
                  if ($updaters.Count -ne 1) { throw "Expected one installed Squirrel updater, found $($updaters.Count)" }
                  $updater = $updaters[0]
                  $appRoot = $updater.DirectoryName
                  if (-not (Test-Path "$appRoot/app-${{ inputs.previous_version }}")) { throw "Previous version was not installed" }
                  Get-Process | Where-Object { $_.Path -like "$appRoot/*" -and $_.Id -ne $PID } | Stop-Process -Force
                  $candidate = (Resolve-Path candidate).Path
                  $update = Start-Process -FilePath $updater.FullName -ArgumentList "--update=`"$candidate`"" -PassThru
                  if (-not $update.WaitForExit(180000)) { throw "Squirrel update timed out" }
                  if ($update.ExitCode -ne 0) { throw "Squirrel upgrade failed: $($update.ExitCode)" }
                  $installed = "$appRoot/app-${{ inputs.candidate_version }}/resources/webapp.asar"
                  if (-not (Test-Path $installed)) { throw "New renderer not installed" }
                  $package = @(Get-ChildItem candidate -Filter "*-full.nupkg")
                  if ($package.Count -ne 1) { throw "Expected one full NuGet package" }
                  Add-Type -AssemblyName System.IO.Compression.FileSystem
                  [System.IO.Compression.ZipFile]::ExtractToDirectory($package[0].FullName, "$pwd/expanded")
                  $source = @(Get-ChildItem expanded -Filter webapp.asar -Recurse)
                  if ($source.Count -ne 1) { throw "Expected one packaged renderer" }
                  if ((Get-FileHash $source[0].FullName).Hash -ne (Get-FileHash $installed).Hash) { throw "Installed renderer differs from release candidate" }
                  "Squirrel upgrade from published ${{ inputs.previous_version }} to ${{ inputs.candidate_version }}: PASS" | Set-Content upgrade-result.txt
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: syndicate-windows-upgrade-result
                  path: |
                      upgrade-result.txt
                      ~/AppData/Local/SquirrelTemp/SquirrelSetup.log
                  retention-days: 14
