name: SYN Linux release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Release version without a leading v
                required: true
                default: 0.1.11
    push:
        branches:
            - syn/main

permissions:
    contents: read
    actions: read

jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        env:
            VARIANT_PATH: syn/release/build.json
            VERSION: ${{ inputs.version || '0.1.11' }}
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 11.22.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: apps/desktop/.node-version
                  cache: pnpm

            - name: Install Linux build dependencies
              run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libnotify4 libxss1 libxtst6 libsecret-1-0

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Smoke test native acceptance startup
              timeout-minutes: 2
              run: timeout 90s xvfb-run -a pnpm --filter element-desktop exec electron --no-sandbox scripts/test-managed-update.mjs deb unused unused unused --self-check-args

            - name: Build customized Syndicate web client
              env:
                  NODE_OPTIONS: --max-old-space-size=6144
                  NX_DAEMON: "false"
                  NX_ISOLATE_PLUGINS: "false"
              run: pnpm --filter element-web build

            - name: Test Syndicate GIF and profile integration
              run: pnpm exec vitest run apps/web/src/utils/GiphyClient.test.ts apps/desktop/src/args.test.ts apps/desktop/src/config.test.ts apps/desktop/src/managed-update-manifest.test.ts apps/desktop/src/managed-updater.test.ts

            - name: Package and verify Syndicate renderer
              working-directory: apps/desktop
              env:
                  GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
              run: node scripts/package-syndicate-web.ts

            - name: Build native modules
              working-directory: apps/desktop
              run: pnpm run build:native

            - name: Build Linux packages
              working-directory: apps/desktop
              run: pnpm run build --x64 --publish never -l deb tar.gz

            - uses: actions/upload-artifact@v4
              with:
                  name: syndicate-linux-${{ env.VERSION }}
                  path: |
                      apps/desktop/dist/*.deb
                      apps/desktop/dist/*.tar.gz
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload renderer provenance
              uses: actions/upload-artifact@v4
              with:
                  name: syndicate-renderer-linux-${{ env.VERSION }}
                  path: |
                      apps/desktop/webapp.asar
                      apps/web/webapp/syndicate-release.json
                  if-no-files-found: error
                  retention-days: 30

